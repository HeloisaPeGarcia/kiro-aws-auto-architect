name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@heloisapegarcia'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish || echo "Package version already published or skipped."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
